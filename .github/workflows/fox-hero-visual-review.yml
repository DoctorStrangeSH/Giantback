name: Fox Hero Blender visual acceptance

on:
  push:
    branches: [feat/cozy-world-visual-pass]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Blender Python module
        run: python -m pip install bpy==4.2.0
      - name: Render Fox Hero
        run: |
          python -c "import runpy,sys; sys.path.insert(0,'tools/blender'); sys.argv=['build_fox_companion.py','--','--output-dir','build/fox_hero']; runpy.run_path('tools/blender/build_fox_companion.py',run_name='__main__')"
      - name: Check review package
        run: |
          python -c "import json,pathlib; p=pathlib.Path('build/fox_hero'); names=['fox_companion_hero_three_quarter.png','fox_companion_hero_front.png','fox_companion_hero_side.png','fox_companion_hero_back.png','fox_companion_hero.blend','fox_companion_hero.obj','fox_companion_hero_rig.json','fox_companion_hero_mesh_report.json']; missing=[n for n in names if not (p/n).is_file()]; assert not missing, missing; assert len(json.loads((p/'fox_companion_hero_rig.json').read_text())['parts'])==17"
      - uses: actions/upload-artifact@v4
        with:
          name: Fox-Hero-Blender-Visual-Review
          path: build/fox_hero/
          if-no-files-found: error
          retention-days: 14
