              'if not player:GetAttribute("Moth") or not player:GetAttribute("MoonBloom") then',
              'foxEquipped and player:GetAttribute("MoonBloom") == true and not traceFound',
              "floorY + 2.55",
              "MoonRelic",
              "StarShard",
              "Resource_StarShard",
              "local function updateMoonGatePuzzle",
              "Звёздный осколок",
              "local function updateMothBloomReveal",
              "Лунная моль раскрыла тайный цветок",
              "FoxScentTrailLocal",
              'not bank or not bank:IsA("BasePart")',
              "FoxScentPaw",
              "updateFoxScentTrail",
              "scentRouteOffsets",
              "routePoints",
              "FoxCache02 = {",
              "FoxCache03 = {",
              "ScentMote",
              "Следуй по золотым следам лап",
              "foxSniffUntil",
              "sniffing and 9 or 4.2",
              "MoonSeed",
              'itemId = "MoonSeed"',
              "FoxCache01",
              "FoxCache02",
              "FoxCache03",
              "Нюх следопыта готов",
              "Лисёнок учуял тайник",
              "CarrotSeed",
              "Carrot",
              "growthSeconds = 180",
              "Farm_Level",
              "МАТЕРИАЛЫ И ФЕРМА",
              "GiantbackAlbum_Studio_v1",
              "BridgeToGrove",
              "BridgeToDusk",
              "GiantbackHUD",
              "МОЙ ОСТРОВ",
              "МОЯ ФЕРМА",
              "МОИ ПИТОМЦЫ",
