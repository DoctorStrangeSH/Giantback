              "GiantbackEnemy",
              "GiantbackCombatRegion",
              "Enum.KeyCode.ButtonR2",
              "Enum.KeyCode.ButtonL2",
              "Enum.KeyCode.ButtonB",
              "ContextActionService:BindAction(",
              "ENEMY_TELEGRAPH_SECONDS = 0.85",
              "PathfindingService:CreatePath(ENEMY_PATH_AGENT)",
              "ENEMY_PATH_REFRESH_SECONDS = 1.15",
              "GiantbackGrantCombatReward",
              "old.completedCombatEncounters = savedCombatEncounters",
              "CombatRegionRequired",
              "local COMBO_DAMAGE = {18, 22, 32}",
              "local FOX_SKILL_DAMAGE = 24",
              "local FOX_SKILL_RANGE = 18",
              "local MOTH_HEAL_AMOUNT = 18",
              "local MOTH_HEAL_RADIUS = 14",
              "healedUserIds = healedPlayers",
              "local function showCompanionImpact(root, accent, radius)",
              "local function findEnemyRoot(enemyId)",
              '"LocalCompanionSkillPulse"',
              "showCompanionImpact(targetRoot, Color3.fromRGB(244, 178, 94), 7)",
              "Players:GetPlayerByUserId(userId)",
              "local COMPANION_SKILL_COOLDOWN = 14",
              'action == "CompanionSkill"',
              'remote:FireServer("CompanionSkill")',
              '"GiantbackCompanion"',
              'showFeedback("ЛИСЁНОК · "',
              'CompanionRequired = "Сначала выбери питомца-компаньона"',
              'CompanionSkillCooldown = "Способность питомца восстанавливается"',
              'CompanionNoTarget = "Лисёнок не видит противника рядом"',
              'CompanionNoOneToHeal = "Рядом никому не требуется лечение"',
              'showFeedback("ЛУННАЯ МОЛЬ · ЛЕЧЕНИЕ ×"',
              "local CHARGE_MIN_SECONDS = 0.45",
              "local CHARGE_MAX_SECONDS = 1.6",
              "local CHARGE_DAMAGE_MAX = 52",
              'action == "ChargeStart"',
              'action == "ChargeRelease"',
              'remote:FireServer("ChargeStart")',
              'remote:FireServer("ChargeRelease")',
              '"GiantbackCharge"',
              "local COMBO_WINDOW_SECONDS = 1.15",
              "PLAYER_FINISHER_BOX",
              "local resistance = entry.isBoss and 0.28 or 1",
              "entry.root:ApplyImpulse(impulse)",
              "comboStep = comboStep",
              "showFeedback(\"ФИНИШЕР!\"",
              "R6 joint names contain spaces",
              "R15 names do not",
              "joints.rightshoulder",
              "joints.lefthip",
              "joints.rootjoint or joints.root",
              "joints.waist",
              "completedCombatEncounters",
              "GroveGrunt01",
              "GroveScout02",
              "GroveTrialChest01",
              "ForestTrialGate",
              "ForestTrialChamber",
