              'type(data.island) == "table" and data.island or data.city',
              "player.RespawnLocation = homeSpawn",
              "occupiedHomeSlots[session.homeSlot] = nil",
              "Bridge_HomeToGrove",
              "homeMaterialCooldowns",
              "gatherHomeMaterial",
