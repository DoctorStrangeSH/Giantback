name: Validate Giantback place

on:
  push:
    branches:
      - main
      - feat/cozy-world-visual-pass
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run resource collection contract tests
        run: python -m unittest discover -s tests -v

      - name: Build Roblox place
        run: python build.py

      - name: Validate generated place and embedded scripts
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("Giantback.rbxlx").getroot()
          names = set()
          for item in root.findall(".//Item"):
              name = item.find("./Properties/string[@name='Name']")
              if name is not None and name.text:
                  names.add(name.text)

          required = {
              "Mossback",
              "Grove",
              "Dusk",
              "ReplicatedStorage",
              "World",
              "WorldVisuals",
              "Album",
              "GiantbackHUD",
          }
          missing = required - names
          if missing:
              raise SystemExit(f"Missing instances in generated place: {sorted(missing)}")

          sources = [
              node.text or ""
              for node in root.findall(".//ProtectedString[@name='Source']")
          ]
          if len(sources) < 4:
              raise SystemExit(f"Expected at least 4 embedded scripts, found {len(sources)}")

          required_markers = [
              "GiantbackAtmosphere",
              "QuestCard",
              "AlbumAction",
              "FoxEncounter",
              "LocalTransparencyModifier",
              "animateModelParts",
              "Tail tip",
              "Wing tip",
              "ResourceNodes",
              "SunPetal",
              "MoonPetal",
              "respawnSeconds = 300",
              "Resource_SunPetal",
              "Resource_MoonPetal",
              "CollectionPanel",
              "МАТЕРИАЛЫ И ФЕРМА",
              "Vector3.new(0.95, 0.14, 0.14)",
              "resourceCooldowns",
              "collectedNodes",
              "RequestResourceState",
              "ResourceState",
              "ResourcePicked",
              "p.MaxActivationDistance + 1",
              "kind = \"renewable\"",
              "old.schemaVersion = 4",
              "old.resourceCooldowns = savedCooldowns",
              "old.collectedNodes = savedCollected",
              "LocalTransparencyModifier = visible and 0 or 1",
              "local function normalizeCity(raw)",
              "PersonalCities",
              "OwnerUserId",
              "savedFarm.plots = citySnapshot.farm.plots",
              "CarrotSeed",
              "Carrot",
              "growthSeconds = 180",
              "Farm_Level",
              "МАТЕРИАЛЫ И ФЕРМА",
              "GiantbackAlbum_Studio_v1",
              "BridgeToGrove",
              "BridgeToDusk",
              "GiantbackHUD",
              "МОЙ ОСТРОВ",
              "МОЯ ФЕРМА",
              "МОИ ПИТОМЦЫ",
              "КАРТА МИРА",
              "ТВОЙ МИР",
              "BridgeDeck",
              "BridgeRail",
              "BridgePost",
          ]
          combined = "\n".join(sources)
          missing_markers = [marker for marker in required_markers if marker not in combined]
          if missing_markers:
              raise SystemExit(f"Missing expected script content: {missing_markers}")

          print(f"Validated Giantback.rbxlx: {len(names)} named instances, {len(sources)} scripts.")
          PY

      - name: Upload generated Roblox place
        uses: actions/upload-artifact@v4
        with:
          name: Giantback-visual-build
          path: Giantback.rbxlx
          if-no-files-found: error
          retention-days: 14
