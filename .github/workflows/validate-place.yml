              "RootvaultRewardRoom",
              "RootvaultRewardChest",
              "RootvaultChest01",
              "RootvaultSentinel01",
              "RootvaultStalker01",
              "RootvaultSealKeeper01",
              "RootvaultSigil",
              "Страж печатей",
              "BossPhase",
              "Phase2WalkSpeed",
              "Phase3WalkSpeed",
              "RootvaultEssence",
              "Корневой охотник",
              "RootvaultKey",
              "RootvaultCombatRegion",
              "Страж хранилища",
              "Rootvault = true",
              "InRootvault",
              "humanoid:TakeDamage",
              "ForestTrialRuneMoon",
              "ForestTrialRuneDawn",
              "ForestTrialRuneTide",
              "TRIAL_RUNE_SEQUENCE",
              "trialPuzzleComplete[player]",
              "Луна → Рассвет → Прилив",
              "hasCompletedForestTrial(session)",
              "Мшистый разведчик",
              "TelegraphSeconds",
              "CombatTrainingGlade",
              "GroveTrainingRegion",
              "Корневой страж",
              "Training stone platform",
              "CombatTelegraphWarning",
              "БЕРЕГИСЬ!",
