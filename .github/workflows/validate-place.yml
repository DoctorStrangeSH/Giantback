name: Validate Giantback place

on:
  push:
    branches:
      - main
      - feat/cozy-world-visual-pass
      - feat/harvesting-feedback-on-latest
      - feat/combat-c0-contract
  pull_request:
    branches:
      - main
      - integration/giantback-consolidation
      - feat/cozy-world-visual-pass
      - feat/harvesting-feedback-on-latest

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run gameplay and world contract tests
        run: python -m unittest discover -s tests -v

      - name: Build Roblox place
        run: python build.py

      - name: Validate generated place and embedded scripts
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("Giantback.rbxlx").getroot()
          names = set()
          for item in root.findall(".//Item"):
              name = item.find("./Properties/string[@name='Name']")
              if name is not None and name.text:
                  names.add(name.text)

          required = {
              "HomeIslandTemplate",
              "ServerStorage",
              "Grove",
              "Dusk",
              "ReplicatedStorage",
              "World",
              "WorldVisuals",
              "Combat",
              "Album",
              "GiantbackHUD",
              "PublicSpawn",
              "HomeBridge01",
              "HomeBridge02",
              "HomeBridge03",
              "HomeBridge04",
              "HomeBridge05",
              "HomeBridge06",
              "HomeBridge07",
              "HomeBridge08",
              "WoodPile",
              "StonePile",
              "FoxCache01",
              "FoxCache02",
              "FoxCache03",
              "MoonBloom",
              "MoonGateTracks",
              "MoonGateRune",
              "MoonRelic",
          }
          missing = required - names
          if missing:
              raise SystemExit(f"Missing instances in generated place: {sorted(missing)}")

          sources = [
              node.text or ""
              for node in root.findall(".//ProtectedString[@name='Source']")
          ]
          if len(sources) < 4:
              raise SystemExit(f"Expected at least 4 embedded scripts, found {len(sources)}")

          required_markers = [
              "GiantbackAtmosphere",
              "QuestCard",
              "AlbumAction",
              "CombatAction",
              "Combat.server.luau",
              "FoxEncounter",
              "LocalTransparencyModifier",
              "animateModelParts",
              "Tail tip",
              "Wing tip",
              "ResourceNodes",
              "SunPetal",
              "MoonPetal",
              "respawnSeconds = 300",
              "Resource_SunPetal",
              "Resource_MoonPetal",
              "CollectionPanel",
              "МАТЕРИАЛЫ И ФЕРМА",
              "Vector3.new(0.95, 0.14, 0.14)",
              "resourceCooldowns",
              "collectedNodes",
              "RequestResourceState",
              "ResourceState",
              "ResourcePicked",
              "p.MaxActivationDistance + 1",
              "kind = \"renewable\"",
              "old.schemaVersion = math.max(tonumber(old.schemaVersion) or 0, 9)",
              "old.resourceCooldowns = savedCooldowns",
              "old.collectedNodes = savedCollected",
              "LocalTransparencyModifier = visible and 0 or 1",
              "local function normalizeCity(raw)",
              "PlayerIslands",
              "HomeIsland_",
              "HOME_ISLAND_SLOT_COUNT = 8",
              "HomeIslandSlot",
              "homeIslandTemplate:Clone()",
              "old.island = savedIsland",
              "old.city = nil",
              "HomeSpawn",
              "OwnerUserId",
              "savedFarm.plots = citySnapshot.farm.plots",
              'type(data.island) == "table" and data.island or data.city',
              "player.RespawnLocation = homeSpawn",
              "occupiedHomeSlots[session.homeSlot] = nil",
              "Bridge_HomeToGrove",
              "homeMaterialCooldowns",
              "gatherHomeMaterial",
              "repairHomeBridge",
              "woodCost, stoneCost = 5, 3",
              "savedIsland.bridges.homeToGrove = citySnapshot.bridges.homeToGrove == true",
              "Resource_Wood",
              "local toolIds = {Axe = true, Pickaxe = true}",
              "local function createHarvestTool(toolId, level)",
              "local function renderTools()",
              "LocalHarvestProgress",
              "message == \"ResourceHit\"",
              "workshop.Name = \"Workshop\"",
              "session.resourceHitCooldowns[def.key]",
              "GroveWood01",
              "DuskStone01",
              "DuskIron01",
              "itemId = \"IronOre\"",
              "local function useHomeSmelter(player, ownerUserId, smelterAnchor)",
              "smelter.Name = \"Smelter\"",
              "old.smelting = smeltingSnapshot",
              "local rewardAmount = math.max(1, math.floor(tonumber(def.amount) or 1))",
              "if action == \"UpgradeTool\" then",
              "Resource_Stone",
              "FOX_SCOUT_COOLDOWN_SECONDS",
              "foxCacheActiveId",
              "foxSearchReadyAt",
              "foxSearchCount",
              "FoxCacheSpot",
              "FoxSearchReadyAt",
              "CollectFoxCache",
              "FoxCacheLocalPrompt",
              "FoxCacheHighlight",
              "FoxCacheVisuals",
              "MoonBloomVisuals",
              "MoonBloomVisual",
              "MothAbilityBurstLocal",
              "LunarSpark",
              "local function playMothAbilityBurst",
              "mothAbility and 21 or 11.5",
              "light.Range = mothAbility and 14 or 9",
              "Chest bib",
              "Cheek fluff",
              "Paw toe",
              "Moth head",
              "Wing lower",
              "Wing lower tip",
              "Wing spot",
              "Antenna tip",
              "local function aroundPoint(point, rotation)",
              "part.CFrame = pivot * transform * offset",
              "local tailHinge = rigOrigin + Vector3.new(0, 0.25, 0.95)",
              "local wingHinge = rigOrigin + Vector3.new(side * 0.42, 0.28, 0)",
              "MoonGateVisuals",
              "MoonGateLocalBarrier",
              "updateMoonGateBarrier",
              "gateJustOpened",
              "TweenService:Create(",
              "task.delay(0.8, function()",
              "MoonGateTracksVisual",
              "MoonGateShell",
              "MoonGateSeal",
              "MoonGateRunesVisual",
              "MoonGateClearingVisual",
              "MoonRelicGem",
              "MoonBloomLocalPrompt",
              "MoonBloomHighlight",
              "CollectMoonBloom",
              "SearchMoonGate",
              "RevealMoonGate",
              "CollectMoonRelic",
              "MoonGateTrace",
              "MoonGateOpen",
              'if not player:GetAttribute("Moth") or not player:GetAttribute("MoonBloom") then',
              'foxEquipped and player:GetAttribute("MoonBloom") == true and not traceFound',
              "floorY + 2.55",
              "MoonRelic",
              "StarShard",
              "Resource_StarShard",
              "local function updateMoonGatePuzzle",
              "Звёздный осколок",
              "local function updateMothBloomReveal",
              "Лунная моль раскрыла тайный цветок",
              "FoxScentTrailLocal",
              'not bank or not bank:IsA("BasePart")',
              "FoxScentPaw",
              "updateFoxScentTrail",
              "scentRouteOffsets",
              "routePoints",
              "FoxCache02 = {",
              "FoxCache03 = {",
              "ScentMote",
              "Следуй по золотым следам лап",
              "foxSniffUntil",
              "sniffing and 9 or 4.2",
              "MoonSeed",
              'itemId = "MoonSeed"',
              "FoxCache01",
              "FoxCache02",
              "FoxCache03",
              "Нюх следопыта готов",
              "Лисёнок учуял тайник",
              "CarrotSeed",
              "Carrot",
              "growthSeconds = 180",
              "Farm_Level",
              "МАТЕРИАЛЫ И ФЕРМА",
              "GiantbackAlbum_Studio_v1",
              "BridgeToGrove",
              "BridgeToDusk",
              "GiantbackHUD",
              "МОЙ ОСТРОВ",
              "МОЯ ФЕРМА",
              "МОИ ПИТОМЦЫ",
              "КАРТА МИРА",
              "ТВОЙ МИР",
              "BridgeDeck",
              "BridgeRail",
              "BridgePost",
              "MAX_ACTIONS_PER_WINDOW = 10",
              "CombatNotEnabled",
              "CombatRegionRequired",
          ]
          combined = "\n".join(sources)
          missing_markers = [marker for marker in required_markers if marker not in combined]
          if missing_markers:
              raise SystemExit(f"Missing expected script content: {missing_markers}")

          print(f"Validated Giantback.rbxlx: {len(names)} named instances, {len(sources)} scripts.")
          PY

      - name: Upload generated Roblox place and original model sources
        uses: actions/upload-artifact@v4
        with:
          name: Giantback-visual-build
          path: |
            Giantback.rbxlx
            assets/source_models/
          if-no-files-found: error
          retention-days: 14
