name: Validate Giantback place

on:
  push:
    branches:
      - main
      - feat/cozy-world-visual-pass
      - feat/harvesting-feedback-on-latest
      - feat/combat-c0-contract
  pull_request:
    branches:
      - main
      - integration/giantback-consolidation
      - feat/cozy-world-visual-pass
      - feat/harvesting-feedback-on-latest

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run gameplay and world contract tests
        run: python -m unittest discover -s tests -v

      - name: Build Roblox place
        run: python build.py

      - name: Validate generated place and embedded scripts
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("Giantback.rbxlx").getroot()
          names = set()
          for item in root.findall(".//Item"):
              name = item.find("./Properties/string[@name='Name']")
              if name is not None and name.text:
                  names.add(name.text)

          required = {
              "HomeIslandTemplate",
              "ServerStorage",
              "Grove",
              "Dusk",
              "ReplicatedStorage",
              "World",
              "WorldVisuals",
              "Combat",
              "Album",
              "GiantbackHUD",
              "PublicSpawn",
              "HomeBridge01",
              "HomeBridge02",
              "HomeBridge03",
              "HomeBridge04",
              "HomeBridge05",
              "HomeBridge06",
              "HomeBridge07",
              "HomeBridge08",
              "WoodPile",
              "StonePile",
              "FoxCache01",
              "FoxCache02",
              "FoxCache03",
              "MoonBloom",
              "MoonGateTracks",
              "MoonGateRune",
              "MoonRelic",
          }
          missing = required - names
          if missing:
              raise SystemExit(f"Missing instances in generated place: {sorted(missing)}")

          sources = [
              node.text or ""
              for node in root.findall(".//ProtectedString[@name='Source']")
          ]
          if len(sources) < 4:
              raise SystemExit(f"Expected at least 4 embedded scripts, found {len(sources)}")

          required_markers = [
              "GiantbackAtmosphere",
              "QuestCard",
              "AlbumAction",
              "CombatAction",
              "GiantbackAttack",
              "GiantbackBlock",
              "GiantbackDodge",
              "GiantbackGrantCombatReward",
              "GiantbackGrantCompanionXP",
              "COMPANION_MAX_LEVEL = 5",
              "normalizeCompanionProgress",
              "Companion_Fox_Level",
              "Companion_Moth_Level",
              "FOX_SKILL_DAMAGE_PER_LEVEL = 3",
              "MOTH_HEAL_PER_LEVEL = 2",
              "foxScoutCooldownForLevel",
              "local healRadius = MOTH_HEAL_RADIUS",
              "Чуткий нюх: поиск каждые 90 сек.",
              "Лунная аура: радиус лечения +2.",
              "local function feedCompanion(player, companionId)",
              "local companionFeedOrder = {\"Pumpkin\", \"Strawberry\", \"Cabbage\", \"Carrot\"}",
              'player:SetAttribute("Companion_" .. id .. "_Bond"',
              "Дружба ",
              "FeedCompanion",
              "StartCompanionPlay",
              "CompanionPlayInput",
              "local function startCompanionPlay(player, companionId)",
              "HttpService:GenerateGUID(false)",
              "companionPlayCooldownSeconds = 25",
              "CompanionPlayStarted",
              "CompanionPlayFinished",
              "local function submitCompanionPlayInput(player, payload)",
              "local function beginCompanionPlay(payload)",
              "local function setCompanionMood(player, companionId, mood)",
              'player:SetAttribute("Companion_" .. companionId .. "_Mood", mood)',
              'Fox = "Любопытство"',
              'Moth = "Спокойствие"',
              'setCompanionMood(player, challenge.companionId, "Радость")',
              'setCompanionMood(player, companionId, "Довольство")',
              "Любопытный исследователь",
              "Нежная хранительница света",
              "local function petCompanion(player, companionId)",
              "PetCompanion",
              "companionPetReadyAt",
              "CompanionPetted",
              "CompanionPettingBurstLocal",
              "local companionActivity = {}",
              "activity.idleSince = now",
              "flapSpeed = 3.2",
              "resting and 0.38",
              "playCompanionPettingBurst(model, id, bondStage)",
              'button(item, "Pet"',
              'growthStage .. " · УР. 5 · МАКСИМУМ",'
              "УР. 5 · МАКСИМУМ",
              "FoxEncounter",
              "CrystalWispEncounter",
              "CrystalWispNest",
              "CrystalWisp",
              "CrystalGrottoPrismVein01",
              "CrystalGrottoPrismVein02",
              "PrismSenseHidden",
              "^OrbitCrystal",
              'local prismSenseActive = state.id == "CrystalWisp"',
              "CrystalWisp = companionMoodDefaults.CrystalWisp",
              "PrismSenseUntil",
              "Призменное чутьё",
